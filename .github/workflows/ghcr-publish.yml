name: OCI Image CI

on:
  push:
    branches: [ "main" ]

env:
    IMAGE_NAME: caddy
    IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    REGISTRY_USER: ${{ github.actor }}
    REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build-and-push:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Get upstream tag
        id: get_upstream_tag
        run: |
          UPSTREAM_TAG=$(awk '/^FROM .*caddy:/ { split($2, a, ":"); print a[2] }' Containerfile | tail -n 1)
          echo "Extracted UPSTREAM_TAG=${UPSTREAM_TAG}"
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "UPSTREAM_TAG must not be empty"
            exit 1
          fi
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> $GITHUB_ENV

      - name: Verify UPSTREAM_TAG
        run: echo "UPSTREAM_TAG is set to ${{ env.UPSTREAM_TAG }}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.UPSTREAM_TAG }}-${{ matrix.platform }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.platform }}

  create-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Create and Push Manifest
        run: |
          echo "Creating and pushing manifest for tag ${{ needs.build-and-push.outputs.UPSTREAM_TAG }}"
          docker manifest create $IMAGE_REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.UPSTREAM_TAG }} \
            --amend $IMAGE_REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.UPSTREAM_TAG }}-amd64 \
            --amend $IMAGE_REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.UPSTREAM_TAG }}-arm64
          docker manifest push $IMAGE_REGISTRY/$IMAGE_NAME:${{ needs.build-and-push.outputs.UPSTREAM_TAG }}
          
          echo "Creating and pushing manifest for latest tag"
          docker manifest create $IMAGE_REGISTRY/$IMAGE_NAME:latest \
            --amend $IMAGE_REGISTRY/$IMAGE_NAME:latest-amd64 \
            --amend $IMAGE_REGISTRY/$IMAGE_NAME:latest-arm64
          docker manifest push $IMAGE_REGISTRY/$IMAGE_NAME:latest