name: OCI Image CI

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: caddy
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          check-latest: true

      - name: Extract the tag from the Containerfile
        id: get_upstream_tag
        run: |
          UPSTREAM_TAG=$(grep -m 2 -oP '(?<=FROM caddy:)[^ ]+' Containerfile | tail -n 1)
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"

      - name: Build and push Docker image for amd64
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.UPSTREAM_TAG }}-amd64
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          check-latest: true

      - name: Extract the tag from the Containerfile
        id: get_upstream_tag
        run: |
          UPSTREAM_TAG=$(grep -m 2 -oP '(?<=FROM caddy:)[^ ]+' Containerfile | tail -n 1)
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_ENV"

      - name: Build and push Docker image for arm64
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.UPSTREAM_TAG }}-arm64
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64

  manifest-push:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-amd64.outputs.get_upstream_tag }} \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-amd64.outputs.get_upstream_tag }}-amd64 \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-arm64.outputs.get_upstream_tag }}-arm64

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64